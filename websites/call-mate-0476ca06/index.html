<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #0f172a;
    --secondary: #1e293b;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.3);
    --neon: #22d3ee;
    --neon-glow: rgba(34, 211, 238, 0.2);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --card-bg: rgba(30, 41, 59, 0.8);
    --border: rgba(99, 102, 241, 0.2);
    --gradient-hero: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --gradient-accent: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
    --gradient-card: linear-gradient(135deg, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.9) 100%);
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--primary);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    background: var(--gradient-accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.3s ease;
    letter-spacing: 0.3px;
  }

  .nav-links a:hover {
    color: var(--accent-light);
  }

  .nav-cta {
    background: var(--gradient-accent);
    color: white !important;
    padding: 0.5rem 1.4rem;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: opacity 0.3s ease, transform 0.2s ease !important;
  }

  .nav-cta:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    color: white !important;
  }

  /* ===== HERO SECTION ===== */
  #hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: var(--gradient-hero);
    padding: 8rem 2rem 4rem;
  }

  .hero-grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(99, 102, 241, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.07) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
  }

  .hero-orb1 {
    position: absolute;
    top: 10%;
    left: -10%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-orb2 {
    position: absolute;
    bottom: 0%;
    right: -5%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(34,211,238,0.1) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
    margin: 0 auto;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.4);
    color: var(--accent-light);
    padding: 0.4rem 1.2rem;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .hero-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--neon);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px var(--neon);
  }

  .hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 1.5rem;
  }

  .hero-title .gradient-text {
    background: var(--gradient-accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: var(--text-secondary);
    max-width: 620px;
    margin: 0 auto 2.5rem;
    line-height: 1.8;
  }

  .hero-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 4rem;
  }

  .btn-primary {
    display: inline-block;
    background: var(--gradient-accent);
    color: white;
    padding: 0.9rem 2.2rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.3px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 30px rgba(99, 102, 241, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(99, 102, 241, 0.6);
  }

  .btn-secondary {
    display: inline-block;
    background: transparent;
    color: var(--text-primary);
    padding: 0.9rem 2.2rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    border: 1px solid rgba(255,255,255,0.2);
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.4);
  }

  .hero-stats {
    display: flex;
    gap: 3rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat-item {
    text-align: center;
  }

  .stat-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    background: var(--gradient-accent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 0.82rem;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 0.2rem;
  }

  /* ===== ABOUT SECTION ===== */
  #about {
    padding: 7rem 2rem;
    position: relative;
    overflow: hidden;
  }

  .section-container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-label {
    display: inline-block;
    color: var(--accent-light);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 1.5rem;
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    align-items: center;
  }

  .about-text p {
    color: var(--text-secondary);
    font-size: 1.05rem;
    line-height: 1.8;
    margin-bottom: 1.5rem;
  }

  .about-features {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 2rem;
  }

  .feature-pill {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.95rem;
    color: var(--text-secondary);
  }

  .feature-pill .check {
    width: 22px;
    height: 22px;
    background: var(--gradient-accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 0.7rem;
    color: white;
  }

  .about-image-wrapper {
    position: relative;
  }

  .about-image-card {
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
  }

  .about-image-card img {
    width: 100%;
    height: 420px;
    object-fit: cover;
    display: block;
    filter: brightness(0.8) saturate(0.9);
  }

  .about-image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(99,102,241,0.2) 0%, transparent 60%);
    pointer-events: none;
  }

  .about-badge-float {
    position: absolute;
    bottom: -20px;
    right: -20px;
    background: var(--gradient-accent);
    border-radius: 20px;
    padding: 1.2rem 1.5rem;
    box-shadow: 0 10px 40px rgba(99,102,241,0.4);
  }

  .about-badge-float .badge-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: white;
    display: block;
  }

  .about-badge-float .badge-txt {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ===== SERVICES SECTION ===== */
  #services {
    padding: 7rem 2rem;
    background: rgba(15, 23, 42, 0.6);
    position: relative;
  }

  #services::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
