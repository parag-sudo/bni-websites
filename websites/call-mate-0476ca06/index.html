<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #6c3bff;
    --primary-dark: #4f1fe8;
    --primary-light: #a07fff;
    --accent: #00d4ff;
    --accent2: #ff6b6b;
    --dark: #0a0a1a;
    --dark2: #12122a;
    --dark3: #1a1a3a;
    --text: #e8e8f0;

    --border: rgba(255,255,255,0.08);

  html {

  body {

  /* NAV */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 1rem 2rem;
    background: rgba(10,10,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);

    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
    letter-spacing: -0.5px;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.3s ease;
    letter-spacing: 0.3px;
  }

  .nav-links a:hover {
    color: var(--white);
  }

  .nav-cta {
    background: var(--gradient-primary);
    color: var(--white) !important;
    padding: 0.5rem 1.25rem;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: opacity 0.3s ease, transform 0.2s ease !important;
  }

  .nav-cta:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    color: var(--white) !important;
  }

  .nav-mobile-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .nav-mobile-toggle span {
    width: 24px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    display: block;
  }

  /* HERO */
  #hero {
    min-height: 100vh;
    background: var(--gradient-hero);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 6rem 2rem 4rem;
  }

  .hero-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
  }

  .hero-glow-1 {
    width: 600px;
    height: 600px;
    background: rgba(108,59,255,0.3);
    top: -200px;
    right: -100px;
  }

  .hero-glow-2 {
    width: 400px;
    height: 400px;
    background: rgba(0,212,255,0.15);
    bottom: -100px;
    left: -100px;
  }

  .hero-grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(108,59,255,0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(108,59,255,0.05) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  .hero-container {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;

    border: 1px solid rgba(108,59,255,0.4);

    padding: 0.4rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--primary-light);
    margin-bottom: 1.5rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .hero-badge::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -1.5px;
    margin-bottom: 1.5rem;
  }

  .hero-title .highlight {
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: 1.1rem;
    color: var(--text-muted);
    margin-bottom: 2.5rem;
    max-width: 480px;
    line-height: 1.7;
  }

  .hero-buttons {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--gradient-primary);
    color: var(--white);
    padding: 0.875rem 2rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
    box-shadow: 0 8px 30px rgba(108,59,255,0.4);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(108,59,255,0.55);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: transparent;
    color: var(--text);
    padding: 0.875rem 2rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .btn-secondary:hover {
    border-color: var(--primary-light);
    background: rgba(108,59,255,0.1);
  }

  .hero-stats {
    display: flex;
    gap: 2rem;
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  }

  .hero-stat-item .stat-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .hero-stat-item .stat-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }

  .hero-visual {
    position: relative;
  }

  .hero-card-main {
    background: var(--gradient-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2rem;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .hero-card-main::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(108,59,255,0.1) 0%, transparent 100%);
    pointer-events: none;
  }

  .call-wave {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 60px;
    margin-bottom: 1.5rem;
  }

  .wave-bar {
    width: 4px;
    border-radius: 4px;
    background: var(--gradient-primary);
    animation: wave 1.2s ease-in-out infinite;
  }

  .wave-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 35px; animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { height: 50px; animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { height: 35px; animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { height: 55px; animation-delay: 0.4s; }
  .wave-bar:nth-child(6) { height: 40px; animation-delay: 0.5s; }
  .wave-bar:nth-child(7) { height: 60px; animation-delay: 0.6s; }
  .wave-bar:nth-child(8) { height: 40px; animation-delay: 0.7s; }
  .wave-bar:nth-child(9) { height: 55px; animation-delay: 0.8s; }
  .wave-bar:nth-child(10) { height: 35px; animation-delay: 0.9s; }
  .wave-bar:nth-child(11) { height: 50px; animation-delay: 1.0s; }
  .wave-bar:nth-child(12) { height: 30px; animation-delay: 1.1s; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .call-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .call-status-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #00e676;
  }

  .call-status-badge::before {
    content: '';
    width: 8px;
    height: 8px;
    background: #00e676;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  .call-timer {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .call-info {
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .call-info-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.25rem;
  }

  .call-info-value {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
  }

  .extraction-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .extraction-tag {
    background: rgba(108,59,255,0.2);
    border: 1px solid rgba(108,59,255,0.3);
    border-radius: 6px;
    padding: 0.25rem 0.6rem;
    font-size: 0.75rem;
    color: var(--primary-light);
  }

  .hero-card-float {
    position: absolute;
    background: rgba(18,18,42,0.95);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.75rem 1rem;
    backdrop-filter: blur(10px);
    font-size: 0.8rem;
  }

  .hero-card-float-1 {
    top: -20px;
    right: -20px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .hero-card-float-1 .icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #00d4ff, #6c3bff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }

  .hero-card-float-2 {
    bottom: -15px;
    left: -20px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* SECTION STYLES */
  section {
    padding: 6rem 2rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(108,59,255,0.12);
    border: 1px solid rgba(108,59,255,0.25);
    border-radius: 50px;
    padding: 0.35rem 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--primary-light);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 1rem;
  }

  .section-title span {
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .section-subtitle {
    font-size: 1rem;
    color: var(--text-muted);
    max-width: 560px;
    line-height: 1.7;
  }

  /* ABOUT */
  #about {
    background: var(--dark2);
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    align-items: center;
  }

  .about-image {
    position: relative;
  }

  .about-img-wrapper {
    border-radius: 24px;
    overflow: hidden;
    position: relative;
  }

  .about-img-wrapper img {
    width: 100%;
    height: 400px;
    object-fit: cover;
    display: block;
    filter: brightness(0.7) saturate(0.8);
  }

  .about-img-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(108,59,255,0.3) 0%, rgba(0,212,255,0.1) 100%);
  }

  .about-img-border {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    border: 1px solid rgba(108,59,255,0.3);
  }

  .about-float-badge {
    position: absolute;
    bottom: -20px;
    right: -20px;
    background: var(--gradient-primary);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    text-align: center;
    box-shadow: 0 20px 50px rgba(108,59,255,0.4);
  }

  .about-float-badge .big-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    color: white;
    line-height: 1;
  }

  .about-float-badge .big-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .about-content {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .about-text {
    color: var(--text-muted);
    line-height: 1.8;
    font-size: 1rem;
  }

  .about-features {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .about-feature-item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }

  .about-feature-icon {
    width: 40px;
    height: 40px;
    min-width: 40px;
    background: rgba(108,59,255,0.15);
    border: 1px solid rgba(108,59,255,0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  .about-feature-text strong {
    display: block;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.15rem;
    font-size: 0.9rem;
  }

  .about-feature-text p {
    color: var(--text-muted);
    font-size: 0.85rem;
    line-height: 1.5;
  }

  .about-owner {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 0.5rem;
  }

  .owner-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--gradient-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .owner-info strong {
    display: block;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .owner-info span {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* SERVICES */
  #services {
    background: var(--dark);
    position: relative;
    overflow: hidden;
  }

  #services::before {
    content: '';
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(108,59,255,0.07) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .services-header {
    text-align: center;
    margin-bottom: 4rem;
  }

  .services-header .section-subtitle {
    margin: 0 auto;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    position: relative;
    z-index: 1;
  }

  .service-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--gradient-primary);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .service-card:hover {
    transform: translateY(-6px);
    border-color: rgba(108,59,255,0.3);
    box-shadow: 0 20px 60px rgba(108,59,255,0.15);
  }

  .service-card:hover::before {
    opacity: 1;
  }

  .service-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .service-icon-1 { background: linear-gradient(135deg, rgba(108,59,255,0.2), rgba(0,212,255,0.1)); }
  .service-icon-2 { background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(108,59,255,0.1)); }
  .service-icon-3 { background: linear-gradient(135deg, rgba(255,107,107,0.2), rgba(108,59,255,0.1)); }
  .service-icon-4 { background: linear-gradient(135deg, rgba(0,230,118,0.2), rgba(0,212,255,0.1)); }
  .service-icon-5 { background: linear-gradient(135deg, rgba(255,200,0,0.2), rgba(255,107,107,0.1)); }
  .service-icon-6 { background: linear-gradient(135deg, rgba(108,59,255,0.25), rgba(255,107,107,0.1)); }

  .service-card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
    color: var(--white);
  }

  .service-card p {
    color: var(--text-muted);
    font-size: 0.88rem;
    line-height: 1.65;
  }

  .service-card-featured {
    grid-column: span 1;
    background: var(--gradient-card);
    border-color: rgba(108,59,255,0.25);
  }

  .service-tag {
    display: inline-block;
    background: rgba(0,212,255,0.15);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    padding: 0.2rem 0.5rem;
    font-size: 0.7rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 0.75rem;
  }

  /* HOW IT WORKS */
  .how-section {
    margin-top: 5rem;
    padding-top: 5rem;
    border-top: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  .how-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .steps-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    position: relative;
  }

  .steps-grid::before {
    content: '';
    position: absolute;
    top: 30px;
    left: 12.5%;
    right: 12.5%;
    height: 1px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    opacity: 0.3;
  }

  .step-item {
    text-align: center;
    padding: 1.5rem 1rem;
  }

  .step-number {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--gradient-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    margin: 0 auto 1.25rem;
    position: relative;
    box-shadow: 0 8px 25px rgba(108,59,255,0.35);
  }

  .step-item h4 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--white);
  }

  .step-item p {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.6;
