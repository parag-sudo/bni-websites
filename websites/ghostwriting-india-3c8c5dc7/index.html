<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #1a1a2e;
    --secondary: #16213e;
    --accent: #c9a96e;
    --accent-light: #e8d5b0;
    --text-light: #f0ece3;
    --text-muted: #a09080;
    --white: #ffffff;
    --surface: #f7f3ed;
    --card-bg: #ffffff;
    --border: #e2d8cc;
    --gradient-hero: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    --shadow: 0 4px 24px rgba(26,26,46,0.10);
    --shadow-lg: 0 12px 48px rgba(26,26,46,0.16);
  }

  html {
    scroll-behavior: smooth;
  }

  body {

    background-color: var(--surface);
    color: var(--primary);
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 999;
    background: rgba(26, 26, 46, 0.97);
    backdrop-filter: blur(10px);
    padding: 0 1.5rem;
    border-bottom: 1px solid rgba(201,169,110,0.2);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .nav-logo span {
    color: var(--text-light);
    font-weight: 400;
    font-style: italic;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 2rem;
  }

  .nav-links a {
    color: var(--text-light);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .nav-links a:hover {
    color: var(--accent);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    background: var(--gradient-hero);
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
    padding: 90px 1.5rem 4rem;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('https://picsum.photos/1600/900?grayscale&blur=2') center/cover no-repeat;
    opacity: 0.07;
  }

  .hero-decor {
    position: absolute;
    top: -100px;
    right: -100px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-decor-2 {
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-block;
    background: rgba(201,169,110,0.15);
    border: 1px solid rgba(201,169,110,0.4);
    color: var(--accent);
    padding: 0.35rem 1rem;
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .hero h1 {

    color: var(--white);
    line-height: 1.2;
    margin-bottom: 1.5rem;
    font-weight: 700;
  }

  .hero h1 em {
    color: var(--accent);
    font-style: italic;
  }

  .hero-desc {
    color: rgba(240,236,227,0.8);
    font-size: 1.05rem;
    font-weight: 300;
    margin-bottom: 2.5rem;
    max-width: 520px;
    line-height: 1.8;
  }

    gap: 1rem;
    flex-wrap: wrap;
  }

    background: var(--accent);
    color: var(--primary);
    padding: 0.85rem 2rem;
    border-radius: 6px;
    text-decoration: none;

    font-size: 0.95rem;
    letter-spacing: 0.03em;

    box-shadow: 0 4px 20px rgba(201,169,110,0.35);
  }

    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(201,169,110,0.45);
  }

  .btn-outline {
    display: inline-block;
    background: transparent;
    color: var(--text-light);
    padding: 0.85rem 2rem;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    border: 1.5px solid rgba(240,236,227,0.35);
    transition: all 0.3s ease;
  }

  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
  }

  .hero-image-wrapper {
    position: relative;
  }

  .hero-img-frame {
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow-lg);
  }

  .hero-img-frame img {
    width: 100%;
    height: 420px;
    object-fit: cover;
    display: block;
  }

  .hero-img-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(26,26,46,0.5) 0%, transparent 60%);
  }

  .hero-stat-card {
    position: absolute;
    bottom: -20px;
    left: -24px;
    background: var(--white);
    padding: 1rem 1.4rem;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);

    align-items: center;
    gap: 0.8rem;
  }

  .stat-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent), #d4b47a);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }

  .stat-text strong {
    display: block;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
  }

  .stat-text span {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 400;
  }

  section {

  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.9rem, 4vw, 2.8rem);
    color: var(--primary);
    line-height: 1.25;
    margin-bottom: 1rem;
    font-weight: 700;
  }

  .section-subtitle {
    color: #6b6060;
    font-size: 1rem;
    max-width: 600px;
    line-height: 1.8;
  }

  .divider {
    width: 56px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    border-radius: 2px;
    margin: 1.2rem 0 2rem;
  }

  #about {
    background: var(--white);
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .about-image-wrap {
    position: relative;
  }

  .about-img-main {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }

  .about-img-main img {
    width: 100%;
    height: 480px;
    object-fit: cover;
    display: block;
  }

  .about-img-accent {
    position: absolute;
    bottom: -24px;
    right: -24px;
    width: 180px;
    height: 180px;
    border-radius: 16px;
    overflow: hidden;
    border: 5px solid var(--white);
    box-shadow: var(--shadow);
  }

  .about-img-accent img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .about-quote {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--text-light);
    padding: 1.4rem 1.6rem;
    border-radius: 12px;
    margin: 2rem 0;
    border-left: 4px solid var(--accent);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.7;
  }

  .about-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .about-list li {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    font-size: 0.95rem;
    color: #4a4040;
  }

  .about-list li::before {
    content: '✦';
    color: var(--accent);
    font-size: 0.7rem;
    margin-top: 0.35rem;
    flex-shrink: 0;
  }

  .about-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }

  .pill {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--primary);
    padding: 0.4rem 1rem;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 500;
  }

  /* ===== SERVICES ===== */
  #services {
    background: var(--surface);
  }
